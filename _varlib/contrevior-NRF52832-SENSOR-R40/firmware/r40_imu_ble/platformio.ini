[env:r40_imu]
platform = nordicnrf52
board = adafruit_feather_nrf52832
framework = arduino
monitor_speed = 115200
build_src_filter =
  +<main.cpp>
  +<sensors.cpp>
  +<sensors_env.cpp>
  +<flash_log.cpp>
  +<buttons.cpp>
  +<nfc_tag.cpp>
  -<ble_smoke.cpp>

build_flags =
  -DNRF52832_XXAA
  -DCFG_DEBUG=0
  -DUSE_LFXO
  -UUSE_LFRC
  ; Free P0.21 for I2C Bus A SCL; do not claim as pin-reset
  -UCONFIG_GPIO_AS_PINRESET

[env:r40_ble_smoke]
extends = env:r40_imu
build_src_filter =
  -<main.cpp>
  +<ble_smoke.cpp>
